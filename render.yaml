databases:
  - name: signature-db
    plan: free
    databaseName: signature_db
    user: signature_user

services:
  - type: web
    name: signature-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/schema/
    # Free-tier services can't use preDeployCommand — migrations run at
    # container start instead, via backend/entrypoint.sh.
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Render assigns a subdomain like signature-backend.onrender.com —
      # the leading dot lets Django's ALLOWED_HOSTS match any subdomain.
      - key: ALLOWED_HOSTS
        value: .onrender.com
      # Fill these in after the frontend is deployed (Vercel URL).
      - key: FRONTEND_URL
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: JWT_ACCESS_TOKEN_LIFETIME
        value: "30"
      - key: JWT_REFRESH_TOKEN_LIFETIME
        value: "7"
      # Google OAuth — leave blank until real credentials exist; the
      # backend falls back to email/password-only auth without this.
      # (No client secret needed — see apps.accounts.views.GoogleAuthView.)
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      # Media storage (portfolio images) — S3-compatible object storage.
      # Leave AWS_STORAGE_BUCKET_NAME blank to fall back to local disk,
      # which Render's ephemeral filesystem wipes on every deploy/restart.
      # See DEPLOYMENT.md §1.4 for a Cloudflare R2 walkthrough.
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        value: auto
      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false
      - key: POSTGRES_DB
        fromDatabase:
          name: signature-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: signature-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: signature-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: signature-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: signature-db
          property: port
