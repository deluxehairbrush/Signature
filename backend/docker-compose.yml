version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: signature_db
      POSTGRES_USER: signature_user
      POSTGRES_PASSWORD: signature_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signature_user -d signature_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=dev-secret-key-not-for-production
      - DEBUG=True
      - POSTGRES_DB=signature_db
      - POSTGRES_USER=signature_user
      - POSTGRES_PASSWORD=signature_pass
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - FRONTEND_URL=http://localhost:3000
      - AI_SERVICE_URL=http://host.docker.internal:3000
      - ALLOWED_HOSTS=localhost,127.0.0.1
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
